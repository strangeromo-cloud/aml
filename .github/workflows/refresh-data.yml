name: Refresh list-source data

on:
  schedule:
    # Daily at 00:00 UTC = 08:00 Beijing
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      strict:
        description: "Exit non-zero on any failure (forces this run to fail)"
        type: boolean
        default: false
      force_email:
        description: "Email the watched lists even if nothing changed (use once for the baseline)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# Who gets pinged on failure issues. Override at repo level via Settings →
# Secrets and variables → Actions → Variables: NOTIFY_USERS = "alice,bob"
env:
  NOTIFY_USERS: ${{ vars.NOTIFY_USERS || 'strangeromo-cloud' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/data-refresh/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('scripts/data-refresh/requirements.txt') }}

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run all fetchers (including headless)
        id: refresh
        run: |
          python -m scripts.data-refresh.refresh_all --include-headless
        continue-on-error: false

      - name: Inspect manifest
        id: manifest
        if: always()
        run: |
          python <<'PY'
          import json, os, pathlib
          p = pathlib.Path("public/downloads/_manifest.json")
          if not p.exists():
              print("::error::manifest not produced — refresh_all crashed before write")
              exit(1)
          m = json.loads(p.read_text())
          fails = [(k, v) for k, v in m.get("sources", {}).items() if v.get("status") != "success"]
          summary = (
              f"Updated: {m.get('updatedAt')}\n"
              f"Total: {m.get('totalFetchers')}, "
              f"Success: {m.get('successCount')}, "
              f"Failures: {m.get('failureCount')}\n"
          )
          if fails:
              summary += "\nFailures:\n"
              for k, v in fails:
                  summary += f"  - {k}: {v.get('error', 'unknown')}\n"
          print(summary)
          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a") as f:
                  f.write(f"failure_count={m.get('failureCount', 0)}\n")
                  # Quote-safe summary via heredoc
                  f.write("summary<<EOF\n")
                  f.write(summary)
                  f.write("\nEOF\n")
                  failed_ids = ",".join(k for k, _ in fails)
                  f.write(f"failed_ids={failed_ids}\n")
          PY

      # Runs BEFORE the commit step on purpose: notify_email diffs the freshly
      # written snapshot against the one still in HEAD, so it must see the old
      # commit. Sends only when a watched list's row content actually changed
      # (or a watched fetcher failed, or force_email was requested).
      - name: Email watched lists on change
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          LIST_ALERT_RECIPIENT: ${{ vars.LIST_ALERT_RECIPIENT || 'ecoafm@lenovo.com' }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "::warning::SMTP_USER / SMTP_PASSWORD secrets not set — skipping the list-change email."
            echo "Add them under Settings → Secrets and variables → Actions → Secrets."
            exit 0
          fi
          python -m scripts.data-refresh.notify_email \
            ${{ github.event.inputs.force_email == 'true' && '--force' || '' }}

      - name: Commit refreshed data
        if: always()
        env:
          GIT_AUTHOR_NAME: aml-data-refresh-bot
          GIT_AUTHOR_EMAIL: aml-bot@noreply.github.com
          GIT_COMMITTER_NAME: aml-data-refresh-bot
          GIT_COMMITTER_EMAIL: aml-bot@noreply.github.com
        run: |
          git add public/downloads/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): daily refresh of list-source downloads

          ${{ steps.manifest.outputs.summary }}"
            git push
          fi

      - name: Open issue on failure
        if: ${{ always() && steps.manifest.outputs.failure_count != '0' && steps.manifest.outputs.failure_count != '' }}
        uses: actions/github-script@v7
        env:
          NOTIFY_USERS: ${{ env.NOTIFY_USERS }}
        with:
          script: |
            const summary = `${{ steps.manifest.outputs.summary }}`;
            const failedIds = `${{ steps.manifest.outputs.failed_ids }}`.split(",").filter(Boolean);
            const notifyUsers = (process.env.NOTIFY_USERS || "")
              .split(",").map(s => s.trim()).filter(Boolean);
            const mentionLine = notifyUsers.length
              ? notifyUsers.map(u => "@" + u).join(" ") + " — heads up:"
              : "";

            const today = new Date().toISOString().slice(0,10);
            const title = `Data refresh failed (${today}) — ${failedIds.join(", ")}`;
            const body = [
              mentionLine,
              ``,
              `### One or more list-source fetchers failed in the daily refresh.`,
              ``,
              "```",
              summary,
              "```",
              ``,
              `**Failed source IDs**: ${failedIds.join(", ")}`,
              ``,
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Likely causes:`,
              `- Upstream URL changed`,
              `- HTML/PDF layout changed (selector / regex needs an update)`,
              `- Cloudflare upgraded its bot-detection (FATF only)`,
              `- Network blip (re-run may resolve)`,
              ``,
              `**Action:** open the workflow run to inspect the failing fetcher's traceback, then patch the corresponding file under \`scripts/data-refresh/fetchers/\`.`,
            ].filter(Boolean).join("\n");

            // De-dupe: if there's already an open issue today, comment instead
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "data-refresh-failure",
            });
            const sameDay = existing.data.find(i => i.title.includes(today));
            if (sameDay) {
              core.info(`Existing issue today: #${sameDay.number}, adding comment`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sameDay.number,
                body,
              });
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["data-refresh-failure", "automation"],
                assignees: notifyUsers,  // sends a direct GitHub notification + email
              });
              core.info(`Created issue #${created.data.number}, assigned to ${notifyUsers.join(", ")}`);
            }
